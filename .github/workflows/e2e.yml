name: E2E

# Every feature, in a real browser, against a throwaway server (tests/e2e).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Cache test fonts
        uses: actions/cache@v6
        with:
          path: tests/e2e/.work/cache
          key: e2e-fonts-${{ hashFiles('tests/e2e/fonts.txt', 'tests/e2e/uploads.txt') }}
      - name: Run the suite
        working-directory: tests/e2e
        run: node run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON: python
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: tests/e2e/results.json
          if-no-files-found: ignore
