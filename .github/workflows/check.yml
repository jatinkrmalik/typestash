name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Index a few fonts and build the demo
        run: |
          printf 'ofl/inter\nofl/pacifico\nofl/spacemono\n' > /tmp/fonts.txt
          python demo/fetch_fonts.py /tmp/fonts.txt /tmp/fonts
          python demo/build_demo.py /tmp/fonts /tmp/site
          test -s /tmp/site/demo/library.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: JavaScript parses
        run: node -e "new Function(require('fs').readFileSync('app/static/app.js','utf8'))"
