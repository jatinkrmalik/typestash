<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typestash</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="stylesheet" href="static/style.css">
<script>
  // Set the theme before first paint so there is no flash.
  try {
    var t = localStorage.getItem("tc.theme");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Home"><span class="wordmark" id="wordmark">Typestash</span></a>
  <div class="tagline" id="tagline"></div>
  <div class="top-actions">
    <button class="btn ghost" id="cmdk-btn" title="Command bar"><span class="lbl-long">Jump to…</span> <kbd>Ctrl K</kbd></button>
    <button class="icon-btn" id="theme-btn" title="Paper / ink"></button>
    <button class="btn primary" id="upload-btn" title="Add fonts (or drop them anywhere)"></button>
    <input type="file" id="file-input" multiple accept=".ttf,.otf,.woff,.woff2,.ttc,.otc,.zip" hidden>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <div class="main">
    <main id="view"></main>
    <footer class="site-foot">
      <div class="foot-mark"><img src="static/favicon.svg" width="22" height="22" alt=""><span>Typestash</span></div>
      <nav class="foot-links" aria-label="About Typestash">
        <a href="https://github.com/jatinkrmalik/typestash" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="stroke:none;fill:currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.530 5.470 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.420-3.58-8-8-8"/></svg><span>Open source</span></a>
        <a href="https://buymeacoffee.com/jk" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8.5h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M12 3.5v2"/></svg><span>Buy me a coffee</span></a>
        <a class="sponsor" href="https://github.com/sponsors/jatinkrmalik" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2.1 0 3.5 1.2 4.4 2.6.9-1.4 2.3-2.6 4.4-2.6 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z"/></svg><span>Sponsor</span></a>
      </nav>
      <p class="foot-by"><a href="https://x.com/jatinkrmalik" target="_blank" rel="noopener">Hand-set with care by @jatinkrmalik</a></p>
      <p class="foot-legal">Fonts belong to their designers and foundries; Typestash doesn't grant any rights to use them. <a href="https://github.com/jatinkrmalik/typestash/blob/main/LICENSE" target="_blank" rel="noopener">MIT licensed</a></p>
    </footer>
  </div>
</div>
<div class="tray" id="tray" hidden></div>
<div class="drop" id="drop" hidden><div class="drop-inner"><div class="drop-glyphs" id="drop-glyphs">Aa</div><p>Drop fonts or .zip files to add them</p></div></div>
<div class="toasts" id="toasts"></div>
<div class="popmenu" id="menu" hidden></div>
<div class="palette" id="palette" hidden>
  <div class="palette-box">
    <input id="palette-input" placeholder="Jump to a font, collection or action…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>
<script src="static/app.js"></script>
</body>
</html>
