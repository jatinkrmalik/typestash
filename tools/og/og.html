<!doctype html>
<!-- Open Graph card template (1200x630). Rendered by tools/og/render.mjs:
     og.html?v=site -> site/og/typestash.png, og.html?v=demo -> site/og/demo.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("../../site/assets/fraunces.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; src: url("../../site/assets/fraunces-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
:root { --paper: #f4efe6; --paper-2: #ebe4d7; --ink: #1a1712; --ink-2: #4a433a; --muted: #7a7064; --accent: #d9481f; --line: rgba(26, 23, 18, .14); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; position: relative; }
.copy { position: absolute; left: 72px; top: 64px; width: 560px; }
.brand { display: flex; align-items: center; gap: 14px; font: 560 34px/1 "Fraunces", serif; font-variation-settings: "opsz" 144, "SOFT" 30; letter-spacing: -.02em; }
.brand img { width: 52px; height: 52px; border-radius: 13px; }
h1 { margin-top: 64px; font: 560 78px/1.0 "Fraunces", serif; font-variation-settings: "opsz" 144, "SOFT" 30; letter-spacing: -.025em; }
h1 em { font-style: italic; font-weight: 420; font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; color: var(--ink-2); }
.cursor { display: inline-block; width: 7px; height: 58px; margin-left: 6px; background: var(--accent); vertical-align: -4px; }
.sub { margin-top: 28px; font-size: 25px; line-height: 1.4; color: var(--ink-2); }
.url { position: absolute; left: 72px; bottom: 56px; font: 500 21px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 10px; margin-top: 60px; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--paper);
  font: 700 16px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
.tag::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #3fcf8e; }
.tag + h1 { margin-top: 26px; }
.shot { position: absolute; left: 676px; top: 92px; width: 760px; border: 1px solid rgba(26, 23, 18, .22); border-radius: 16px; overflow: hidden; background: #fbf8f2;
  box-shadow: 0 2px 4px rgba(26, 23, 18, .06), 0 24px 60px -12px rgba(26, 23, 18, .28); }
.shot .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.shot .bar i { width: 9px; height: 9px; border-radius: 50%; background: rgba(26, 23, 18, .18); }
.shot img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="copy">
  <div class="brand"><img src="../../app/static/icon-512.png" alt="">Typestash</div>
  <div id="content"></div>
</div>
<div class="url" id="url"></div>
<div class="shot"><div class="bar"><i></i><i></i><i></i></div><img id="shot" alt=""></div>
<script>
  const v = new URLSearchParams(location.search).get("v") || "site";
  const C = {
    site: {
      html: `<h1>Every font you own. <em>One home</em><span class="cursor"></span></h1>
             <p class="sub">A self-hosted font library with live previews, a type tester and compare. One Docker command.</p>`,
      url: "typestash.j47.in", shot: "../../docs/gallery-light.png",
    },
    demo: {
      html: `<div class="tag">Live demo</div>
             <h1>Try it in <em>your browser</em><span class="cursor"></span></h1>
             <p class="sub">Browse ${new URLSearchParams(location.search).get("n") || "445"} open-licensed font families. Nothing to install.</p>`,
      url: "typestash.j47.in/demo", shot: "../../docs/compare.png",
    },
  }[v];
  document.getElementById("content").innerHTML = C.html;
  document.getElementById("url").textContent = C.url;
  document.getElementById("shot").src = C.shot;
</script>
</body>
</html>
